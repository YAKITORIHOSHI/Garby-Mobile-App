name: Android build

# Builds and tests the app on every push, and produces the installable APK the release
# carries. The signing key comes from repository secrets; without them the APK is signed with
# the runner's debug key (it installs, but not over an APK signed with another key).
on:
  push:
    branches: [main, phone-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Static checks
        run: python3 tools/static_quality_check.py

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GARBY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/garby-release.p12"
            echo "GARBY_KEYSTORE_FILE=$RUNNER_TEMP/garby-release.p12" >> "$GITHUB_ENV"
          else
            echo "No signing secret: the APK will carry the runner's debug key."
          fi

      - name: Unit tests, lint and APK
        env:
          GARBY_KEYSTORE_PASSWORD: ${{ secrets.GARBY_KEYSTORE_PASSWORD }}
          GARBY_KEY_ALIAS: garby
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleBenchmark

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/benchmark/app-benchmark.apk out/GarbyMobileApp.apk
          sha256sum out/GarbyMobileApp.apk | tee out/GarbyMobileApp.apk.sha256
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/GarbyMobileApp.apk | head -n 4 | tee out/signer.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: GarbyMobileApp
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
